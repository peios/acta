name: Publish Acta release
on:
    workflow_dispatch:
        inputs:
            version:
                description: "Unique release version, e.g. v0.1.0 or v0.1.0-rc.1"
                required: true
            previous_version:
                description: Previous compatible release for update/recovery testing (omit only for v0.1.0-rc.1)
                required: false
            notes:
                description: Release notes
                required: true
permissions:
    contents: write
    packages: write
env:
    # The pekit Acta is built with: a commit of github.com/peios/pekit.
    PEKIT_REV: c8fd9a56486fe0968d5a17acb6a24bc8c17972d2
concurrency:
    group: acta-release
    cancel-in-progress: false
jobs:
    release:
        if: github.repository == 'peios/acta' && github.ref == 'refs/heads/main' && vars.ACTA_RELEASE_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
            - name: Validate release inputs and signing configuration
              env:
                  VERSION: ${{ inputs.version }}
                  RELEASE_NOTES: ${{ inputs.notes }}
                  SIGNING_SEED: ${{ secrets.ACTA_RELEASE_SIGNING_SEED }}
                  PREVIOUS: ${{ inputs.previous_version }}
              run: python3 scripts/validate-release.py
            - name: Require recovery validation after the bootstrap release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PREVIOUS: ${{ inputs.previous_version }}
                  VERSION: ${{ inputs.version }}
              run: |
                  if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo 'Release version already exists'; exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
                    echo 'Release tag already exists'; exit 1
                  fi
            - name: Install pekit and the sandbox it runs steps in
              run: tools/ci-install-pekit
            - name: Build and check release source
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  printf '%s\n' "${VERSION#v}" > build/release-version
                  pekit run style
                  pekit test --strict
                  tools/export
            - name: Log in to the container registry
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            - name: Package release
              env:
                  VERSION: ${{ inputs.version }}
                  ACTA_RELEASE_ENABLED: ${{ vars.ACTA_RELEASE_ENABLED }}
              run: |
                  python3 scripts/package-release.py --repository "$GITHUB_REPOSITORY" --version "$VERSION" --sequence "$GITHUB_RUN_NUMBER" --notes /tmp/release-notes --output /tmp/manifest.json
                  cp bin/acta-update /tmp/acta-update
            - name: Sign the manifest
              env:
                  SIGNING_SEED: ${{ secrets.ACTA_RELEASE_SIGNING_SEED }}
              run: |
                  umask 077
                  printf '%s' "$SIGNING_SEED" > /tmp/release-key
                  trap 'rm -f /tmp/release-key' EXIT
                  /tmp/acta-update -key /tmp/release-key -input /tmp/manifest.json -output /tmp/acta-release.json sign
                  /tmp/acta-update -public-key deploy/update/release.pub -input /tmp/acta-release.json verify
            - name: Exercise the real update and failed migration recovery
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PREVIOUS: ${{ inputs.previous_version }}
              run: |
                  mkdir -p /tmp/previous-release bin
                  cp /tmp/acta-update bin/acta-update
                  python3 scripts/test-update-timeline.py
                  if [ -n "$PREVIOUS" ]; then
                    gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern acta-release.json --dir /tmp/previous-release
                    python3 scripts/test-update-compose.py --current /tmp/previous-release/acta-release.json --target /tmp/acta-release.json
                  else
                    python3 scripts/test-update-compose.py --bootstrap --target /tmp/acta-release.json
                  fi
            - name: Publish release after recovery validation
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ inputs.version }}
              run: |
                  flags=(--latest)
                  if [[ "$VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
                  gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" --title "$VERSION" --notes-file /tmp/release-notes /tmp/acta-release.json /tmp/acta-update
