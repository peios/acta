name: Acta build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: acta-check-${{ github.ref }}
    cancel-in-progress: true

env:
    # The pekit Acta is built with: a commit of github.com/peios/pekit.
    PEKIT_REV: c8fd9a56486fe0968d5a17acb6a24bc8c17972d2

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install pekit and the sandbox it runs steps in
              run: tools/ci-install-pekit
            - name: Check style
              run: pekit run style
            - name: Run the tests
              run: pekit test --strict
            - name: Build the programs
              run: pekit build --strict programs

    integration:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        services:
            postgres:
                image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
                env:
                    POSTGRES_USER: acta
                    POSTGRES_PASSWORD: acta-test-only
                    POSTGRES_DB: acta
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U acta -d acta"
                    --health-interval 2s --health-timeout 3s --health-retries 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install pekit and the sandbox it runs steps in
              run: tools/ci-install-pekit
            - name: Run the tests against PostgreSQL
              env:
                  ACTA_TEST_DATABASE_URL: postgres://acta:acta-test-only@127.0.0.1:5432/acta?sslmode=disable
              run: pekit run integration
