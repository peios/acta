sitename = "Acta Documentation"
title = "Acta Documentation"
description = "Using, operating, and developing Acta."
footer = "Peios Learn"
featured = ["acta"]

[lint]
rules = [
  "spelling", "em-dash", "double-hyphen", "curly-quotes",
  "invisible-characters", "exclamation", "ampersand", "double-space",
  "title-case", "heading-case", "heading-punctuation", "heading-levels",
  "code-language", "shell-prompt", "line-length", "hex-case", "serial-comma",
]
line_length = 78
proper_nouns = [
  "Migration Assistant", "Acta", "PostgreSQL", "Svelte", "SvelteKit", "Vite", "OAuth", "MCP", "JSON", "CLI", "API", "HTTP", "HTTPS", "WebAuthn", "Web Push", "Docker", "Caddy", "Go", "GitHub", "Linux", "pgBackRest", "Argon2id", "TypeScript", "JavaScript", "UTC", "SQL", "UUID", "WAL", "NFC", "CSRF", "MFA", "HTML", "CSS", "PKCE", "VAPID", "Ed25519", "SHA", "Peios", "GXWI", "Registry Editor", "Linux", "Windows", "Microsoft",
  "Microsoft Open Specifications", "Core Style", "Word List",
  "regman", "evman", "netd", "peinit", "authd",
]

[lint.spelling]
banned-words = ["banned-words.txt"]
