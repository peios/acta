# Operator-owned, mode 0600. This example uses a mounted offsite repository.
# Configure S3/SFTP/TLS via pgBackRest's documented repository settings instead
# where appropriate. Keep credentials out of Acta settings and environment dumps.
[global]
repo1-path=/mnt/acta-repository
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REPLACE_WITH_A_RANDOM_SECRET
repo1-retention-full=2
expire-auto=n
log-level-file=detail
log-path=/var/log/pgbackrest
lock-path=/var/lib/acta-backup/pgbackrest-lock
spool-path=/var/lib/acta-backup/pgbackrest-spool
[acta2]
pg1-path=/var/lib/postgresql/17/main
pg1-socket-path=/var/run/postgresql
