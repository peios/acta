{{define "title"}}{{.Title}} · {{.Workspace.Name}} · Acta{{end}}
{{define "content"}}
<main class="stage stage--wide">
  <div class="archive-head reveal d1">
    <h1 class="title" style="font-size: 1.45rem; margin: 0;">{{.Title}}</h1>
    <a class="toplink" href="{{.BackHref}}">&lsaquo; Back to board</a>
  </div>

  {{if .Items}}
  <div class="arch-list reveal d1">
    {{range .Items}}
    <div class="arch-row">
      <div>
        <div class="arch-title">{{.Title}}</div>
        <div class="arch-meta">{{.StatusName}} · archived {{.Archived}}</div>
      </div>
      <div class="arch-actions">
        <form method="post" action="/{{$.Workspace.Slug}}/items/{{.ID}}/unarchive">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button class="btn-secondary" type="submit">Restore</button>
        </form>
        <form method="post" action="/{{$.Workspace.Slug}}/items/{{.ID}}/delete">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button class="link-danger" type="submit">Delete</button>
        </form>
      </div>
    </div>
    {{end}}
  </div>
  {{else}}
  <p class="subtitle reveal d1">Nothing archived.</p>
  {{end}}
</main>
{{end}}
